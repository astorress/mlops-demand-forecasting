services:
  mlops_demand_forecasting:
    container_name: 'MlopsDemandForecasting'
    build:
      # Carpeta del proyecto: la imagen instala container/requirements.txt.
      context: ..
      dockerfile: .docker/Dockerfile
      target: img-demandforecasting
    ports:
      # JupyterLab para experimentar en local (jupyter lab --ip 0.0.0.0).
      - 8889:8888
    volumes:
      # Raíz del monorepo: este proyecto queda en /app/aws.
      - ../..:/app
      - mlops-demand-forecasting-bashhistory:/commandhistory
      # Daemon Docker del host: construir/publicar la imagen (npm run image:push).
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../.envs/aws.env
      - ../.envs/sls.env
      - ../.envs/config.env
    working_dir: /app/aws
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - sleep infinity

volumes:
  mlops-demand-forecasting-bashhistory:
