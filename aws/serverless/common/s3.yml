Resources:
  # Zonas del data lake (por prefijo): raw/ (tal como se ingiere), curated/
  # (limpio, tipado, Parquet) y predictions/ (salidas de inferencia batch).
  # Cada proyecto escribe bajo su propio prefijo <zona>/<proyecto>/.
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.s3.dataLakeBucketName}
      VersioningConfiguration:
        Status: Enabled
      # S3 → EventBridge: los proyectos reaccionan a archivos raw nuevos
      # (ingesta por eventos) sin pelear por la NotificationConfiguration.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ${self:custom.servicePrefix}-DataLakeNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: ${self:custom.s3.noncurrentVersionExpirationInDays.${self:custom.stage}}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Artefactos de ML: código, datasets intermedios del pipeline, modelos,
  # reportes de evaluación, baselines, data capture del endpoint y reportes
  # de monitoreo. Versionado para que todo artefacto sea reproducible.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.s3.artifactsBucketName}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ${self:custom.servicePrefix}-ArtifactsNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: ${self:custom.s3.noncurrentVersionExpirationInDays.${self:custom.stage}}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.s3.athenaResultsBucketName}
      LifecycleConfiguration:
        Rules:
          - Id: ${self:custom.servicePrefix}-AthenaResults
            Status: Enabled
            ExpirationInDays: ${self:custom.s3.athenaResultsExpirationInDays.${self:custom.stage}}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
