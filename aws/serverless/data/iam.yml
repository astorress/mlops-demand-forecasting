Resources:
  IngestDatasetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-IngestDataset
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-IngestDataset
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: ${self:custom.s3.dataLakeBucketArn}/${self:custom.prefixes.raw}/*

  # Compartido por el crawler y el job de curación.
  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-Glue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-Glue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - ${self:custom.s3.dataLakeBucketArn}
                  - ${self:custom.s3.artifactsBucketArn}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - ${self:custom.s3.dataLakeBucketArn}/${self:custom.prefixes.raw}/*
                  - ${self:custom.s3.artifactsBucketArn}/${self:custom.prefixes.code}/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - ${self:custom.s3.dataLakeBucketArn}/${self:custom.prefixes.curated}/*
                  - ${self:custom.s3.artifactsBucketArn}/${self:custom.prefixes.glueTemp}/*
              # Spark en Glue (EMRFS) crea objetos marcador vacíos
              # "<carpeta>_$folder$" para cada ancestro de la ruta de salida al
              # hacer commit. Quedan fuera de los prefijos de arriba: van aquí.
              # Si cambian prefixes.curated/glueTemp, actualizar esta lista.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - ${self:custom.s3.dataLakeBucketArn}/curated_$folder$
                  - ${self:custom.s3.dataLakeBucketArn}/curated/demand_forecasting_$folder$
                  - ${self:custom.s3.dataLakeBucketArn}/${self:custom.prefixes.curated}_$folder$
                  - ${self:custom.s3.artifactsBucketArn}/tmp_$folder$
                  - ${self:custom.s3.artifactsBucketArn}/tmp/demand-forecasting_$folder$
                  - ${self:custom.s3.artifactsBucketArn}/${self:custom.prefixes.glueTemp}_$folder$
              - Effect: Allow
                Action:
                  - glue:PublishDataQuality
                  - glue:GetDataQualityResult
                Resource: '*'

  # EventBridge → workflow de Glue (trigger EVENT).
  IngestionEventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-IngestionEvents
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-IngestionEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: glue:NotifyEvent
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${self:custom.glue.workflowName}
