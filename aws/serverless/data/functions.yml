IngestDataset:
  name: ${self:custom.servicePrefix}-IngestDataset
  description: Genera la serie horaria sintética en la zona raw (invocación manual)
  handler: src/functions/ingestion/ingest_dataset.handler
  package:
    patterns:
      - ../../src/__init__.py
      - ../../src/datasets/*.py
      - ../../src/features/__init__.py
      - ../../src/features/calendar.py
      - ../../src/features/schema.py
      - ../../src/functions/__init__.py
      - ../../src/functions/ingestion/*.py
      - ../../src/services/__init__.py
      - ../../src/services/s3.py
      - ../../src/utilities/*.py
  role: !GetAtt IngestDatasetRole.Arn
  timeout: 120
  memorySize: 512
  environment:
    DATA_LAKE_BUCKET_NAME: ${self:custom.s3.dataLakeBucketName}
    RAW_PREFIX: ${self:custom.prefixes.raw}
    DEFAULT_START_DATE: ${self:custom.dataset.startDate}
    DEFAULT_END_DATE: ${self:custom.dataset.endDate}
